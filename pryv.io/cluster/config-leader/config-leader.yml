version: "3.5"
services:
  config-leader:
    image: "docker.io/pryvio/config-leader:1.2.22"
    container_name: pryvio_config_leader
    networks:
      - frontend
      - backend
    volumes:
      - ./conf/:/app/conf/
      - ./log/:/app/log/
      - ./data/:/app/data/
      - ./database/:/app/database/
    restart: always
networks:
  frontend:
    driver: bridge
    external: true
    name: frontend
  backend:
    driver: bridge
    external: true
    name: backend
